<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IP-Tracer | RAR.zxc</title>
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: #111827;
            --accent-green: #10b981;
            --accent-red: #ef4444;
            --text-main: #f3f4f6;
            --text-dim: #9ca3af;
            --border-color: #1f2937;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Fira Code', 'Courier New', Courier, monospace;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 750px;
            margin-top: 20px;
        }

        .header {
            text-align: center;
            margin-bottom: 25px;
        }

        .brand-title {
            color: var(--accent-green);
            font-size: 2.2rem;
            letter-spacing: 2px;
            font-weight: bold;
        }

        .brand-subtitle {
            color: var(--text-dim);
            font-size: 0.9rem;
            margin-top: 5px;
        }

        .search-box {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        input[type="text"] {
            flex: 1;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            padding: 12px 16px;
            border-radius: 8px;
            color: var(--text-main);
            outline: none;
            font-size: 0.95rem;
        }

        input[type="text"]:focus {
            border-color: var(--accent-green);
        }

        button {
            background: var(--accent-green);
            color: #000;
            border: none;
            padding: 12px 20px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        button:hover {
            opacity: 0.9;
        }

        .btn-secondary {
            background: var(--card-bg);
            color: var(--text-main);
            border: 1px solid var(--border-color);
        }

        .btn-secondary:hover {
            border-color: var(--accent-green);
        }

        .results-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            display: none;
        }

        .results-header {
            color: var(--accent-green);
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 10px;
            margin-bottom: 15px;
            font-size: 1.1rem;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 12px;
        }

        .data-item {
            display: flex;
            justify-content: space-between;
            background: rgba(255, 255, 255, 0.02);
            padding: 10px;
            border-radius: 6px;
            border: 1px solid rgba(255, 255, 255, 0.03);
        }

        .data-label {
            color: var(--text-dim);
            font-size: 0.85rem;
        }

        .data-value {
            color: var(--text-main);
            font-weight: bold;
            font-size: 0.85rem;
            text-align: right;
        }

        .error-msg {
            color: var(--accent-red);
            text-align: center;
            margin-top: 15px;
            display: none;
        }

        footer {
            margin-top: 40px;
            text-align: center;
            color: var(--text-dim);
            font-size: 0.8rem;
            border-top: 1px solid var(--border-color);
            padding-top: 15px;
            width: 100%;
            max-width: 750px;
        }

        footer a {
            color: var(--accent-green);
            text-decoration: none;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <div class="brand-title">RAR.zxc // IP-Tracer</div>
            <div class="brand-subtitle">Real-time IP Geolocation & Network Intelligence</div>
        </div>

        <div class="search-box">
            <input type="text" id="targetIp" placeholder="Enter IP address (e.g., 8.8.8.8)">
            <button onclick="traceIP()">Trace IP</button>
            <button class="btn-secondary" onclick="traceMyIP()">My IP</button>
        </div>

        <div id="error" class="error-msg">Failed to retrieve IP information.</div>

        <div id="results" class="results-card">
            <div class="results-header">> IP Information Results</div>
            <div class="grid">
                <div class="data-item"><span class="data-label">IP Address</span><span class="data-value" id="res-query">-</span></div>
                <div class="data-item"><span class="data-label">Country</span><span class="data-value" id="res-country">-</span></div>
                <div class="data-item"><span class="data-label">Region</span><span class="data-value" id="res-region">-</span></div>
                <div class="data-item"><span class="data-label">City</span><span class="data-value" id="res-city">-</span></div>
                <div class="data-item"><span class="data-label">Zip Code</span><span class="data-value" id="res-zip">-</span></div>
                <div class="data-item"><span class="data-label">Timezone</span><span class="data-value" id="res-timezone">-</span></div>
                <div class="data-item"><span class="data-label">ISP</span><span class="data-value" id="res-isp">-</span></div>
                <div class="data-item"><span class="data-label">ASN</span><span class="data-value" id="res-as">-</span></div>
                <div class="data-item"><span class="data-label">Coordinates</span><span class="data-value" id="res-coords">-</span></div>
            </div>
        </div>
    </div>

    <footer>
        Powered by <a href="#">RAR.zxc</a> | Hosted on Vercel
    </footer>

    <script>
        async function fetchIPData(ip = '') {
            const errorDiv = document.getElementById('error');
            const resultsDiv = document.getElementById('results');
            
            errorDiv.style.display = 'none';
            resultsDiv.style.display = 'none';

            try {
                // Calls backend serverless endpoint on Vercel
                const response = await fetch(`/api/trace?ip=${encodeURIComponent(ip)}`);
                const data = await response.json();
                
                if (!response.ok || !data.ip) {
                    throw new Error(data.message || 'Invalid IP address or lookup failed.');
                }

                document.getElementById('res-query').innerText = data.ip || '-';
                document.getElementById('res-country').innerText = `${data.country} (${data.country_code})` || '-';
                document.getElementById('res-region').innerText = data.region || '-';
                document.getElementById('res-city').innerText = data.city || '-';
                document.getElementById('res-zip').innerText = data.postal || '-';
                document.getElementById('res-timezone').innerText = data.timezone?.id || '-';
                document.getElementById('res-isp').innerText = data.connection?.isp || '-';
                document.getElementById('res-as').innerText = data.connection?.asn ? `AS${data.connection.asn}` : '-';
                document.getElementById('res-coords').innerText = `${data.latitude}, ${data.longitude}`;

                resultsDiv.style.display = 'block';
            } catch (err) {
                errorDiv.innerText = err.message || 'Unable to trace IP Address.';
                errorDiv.style.display = 'block';
            }
        }

        function traceIP() {
            const ip = document.getElementById('targetIp').value.trim();
            if (ip) {
                fetchIPData(ip);
            }
        }

        function traceMyIP() {
            document.getElementById('targetIp').value = '';
            fetchIPData('');
        }

        window.onload = () => traceMyIP();
    </script>
</body>
</html>
